name: "test, lint and publish"

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: "Check package quality (Python ${{ matrix.python-version }}"
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    uses: ./.github/workflows/_quality.yaml
    with:
      python-version: ${{ matrix.python-version }}