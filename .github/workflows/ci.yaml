name: "Check project quality: test, lint, type-checking, vulnerability and dead code detection"

on:
  push:
  workflow_dispatch:

jobs:
  quality:
    name: "Check quality (Python ${{ matrix.python-version }}"
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12"]
    uses: ./.github/workflows/_quality.yaml
    with:
      python-version: ${{ matrix.python-version }}