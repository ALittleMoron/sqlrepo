[project]
name = "sqlrepo"
version = "6.0.0"
description = "sqlalchemy repositories with crud operations and other utils for it."
authors = [{ name = "Dmitriy Lunev", email = "dima.lunev14@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0",
    "python-dev-utils>=7.0.1",
    "sqlalchemy-dev-utils>=1.3.0",
    "sqlalchemy-filter-converter>=1.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12.11",
    "vulture>=2.14",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "black>=25.1.0",
    "coverage>=7.10.6",
    "isort>=6.0.1",
    "pyright>=1.1.404",
    "freezegun>=1.5.5",
    "mimesis>=18.0.0",
    "ipython>=9.5.0",
    "sqlalchemy-utils>=0.42.0",
    "psycopg2-binary>=2.9.10",
    "asyncpg>=0.30.0",
    "pytest-asyncio>=1.1.0",
    "httpx>=0.28.1",
    "pyment>=0.3.3",
    "bandit>=1.8.6",
]

[tool.ruff]
lint.select = ["ALL"]
lint.ignore = [
    "D100",
    "B008",
    "D104",
    "Q000",
    "S101",
    "PT016",
    "ANN101",
    "ANN102",
    "PLR0913",
    "UP037",
    "PLC0414",
    "COM812",
    "ISC001",
    "FIX002",
    "TD002",
    "TD003"
]
line-length = 100
output-format = "concise"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".eggs",
    "*.egg",
    "dist",
    "tests/fixtures/**",
    "tests/**/snapshots/**",
    "alembic",
    "airich",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.mccabe]
max-complexity = 11

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["D101", "D102", "D103", "ANN201", "ANN202", "ANN401", "SLF001", "FAST002", "FBT001"]
"*/types.py" = ["D", "ANN"]
"*/logger.py" = ["D", "ANN", "ARG"]
"*/abc.py" = ["D", "ANN"]


[tool.black]
line-length = 100
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''


[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3


[tool.coverage]
[tool.coverage.run]
source = ["sqlrepo"]
branch = true
omit = ['*/logger.py', '*/types.py', '*/abc.py']

[tool.coverage.report]
exclude_lines = [
    "enum.Enum",
    "# pragma: no cover",
    "# pragma: no coverage",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
]

[tool.pytest]
testpath = "tests"
asyncio_mode = "auto"

[tool.bandit]
exclude = ['tests']

[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']

[tool.pdm]
distribution = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
